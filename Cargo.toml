[package]
name = "eventually-any"
description = "PostgreSQL, SQLite, and MySQL backend for the eventually event-sourcing framework, powered by sqlx::AnyPool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
eventually = { version = "0.5.0", features = [
    "serde-json",
], git = "https://github.com/get-eventually/eventually-rs" }
futures = "0.3"
serde_json = "1.0"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "any",
    "migrate",
    "json",
] }
thiserror = "2.0.18"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt", "rt-multi-thread"] }
eventually-macros = { git = "https://github.com/get-eventually/eventually-rs", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
rand = "0.10"
testcontainers-modules = { version = "0.15.0", features = [
    "postgres",
    "mysql",
] }

[features]
default = []
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
mysql = ["sqlx/mysql"]
migrations = []
snapshots = []
tracing = ["dep:tracing"]
full = ["postgres", "sqlite", "mysql", "migrations", "snapshots", "tracing"]

[[test]]
name = "aggregate_repository"
required-features = ["migrations"]

[[test]]
name = "event_store"
required-features = ["migrations"]

[[test]]
name = "schema_versioning"
required-features = ["migrations"]

[[test]]
name = "snapshot_repository"
required-features = ["migrations", "snapshots"]

[[example]]
name = "bank_account"
path = "examples/bank_account.rs"
required-features = ["sqlite", "migrations"]

[[example]]
name = "order_lifecycle"
path = "examples/order_lifecycle.rs"
required-features = ["sqlite", "migrations"]

[[example]]
name = "concurrent_writes"
path = "examples/concurrent_writes.rs"
required-features = ["sqlite", "migrations"]

[[example]]
name = "snapshot_repository"
path = "examples/snapshot_repository.rs"
required-features = ["sqlite", "snapshots", "migrations"]

[[example]]
name = "multi_schema_upcasting"
path = "examples/multi_schema_upcasting.rs"
required-features = ["sqlite", "migrations"]

[[example]]
name = "multi_database"
path = "examples/multi_database.rs"
required-features = ["sqlite", "postgres", "mysql", "migrations"]
